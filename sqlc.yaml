version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        overrides:
          - db_type: "inet"
            nullable: true
            go_type:
              type: "Prefix"
              import: "net/netip"
              pointer: true
          - db_type: "inet"
            go_type:
              type: "Prefix"
              import: "net/netip"
          - db_type: "cidr"
            go_type:
              type: "Prefix"
              import: "net/netip"
          # pgvector: always emit *pgvector.Vector (params and columns).
          # Columns are declared public.vector(1536) in the baseline schema;
          # without this override sqlc maps the type to interface{}.
          - db_type: "public.vector"
            go_type:
              type: "Vector"
              import: "github.com/pgvector/pgvector-go"
              pointer: true
          - db_type: "public.vector"
            nullable: true
            go_type:
              type: "Vector"
              import: "github.com/pgvector/pgvector-go"
              pointer: true
