name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (blank = last staging build)'
        required: false

# Manual production deploy — the dispatch click is the promotion gate.
#
# api: the image is env-agnostic (all config is runtime JC_* env), so prod
# ships the exact digest staging ran — retagged registry-side via
# `imagetools create`, no pull, no rebuild.
#
# frontends: PUBLIC_* values are inlined at vite build time and differ
# between environments, so frontend images are built at dispatch with the
# `production` environment's variables — same source commit, prod config,
# warmed by the local buildx cache.
#
# Prod deploy webhooks live on the `production` environment's secrets:
#   COOLIFY_WEBHOOK_API, _MAIN, _ADMIN, _CONTROL, _ACADEMY, _DOCS

permissions:
  contents: read

jobs:
  promote-api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Open registry SSH tunnel
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ci_registry
          chmod 600 ~/.ssh/ci_registry
          ssh -fN -i ~/.ssh/ci_registry \
            -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -L 5000:127.0.0.1:5000 root@${{ vars.VPS_HOST }}
          timeout 15 bash -c 'until echo > /dev/tcp/127.0.0.1/5000 2>/dev/null; do sleep 1; done'

      - name: Log in to the private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login localhost:5000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Retag api staging → production
        run: |
          docker buildx imagetools create \
            --tag localhost:5000/japa-api:production \
            localhost:5000/japa-api:${{ inputs.sha || 'staging' }}

  build-frontends:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: [main, admin, control, academy, docs]
    env:
      IMAGE: localhost:5000/japa-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Open registry SSH tunnel
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ci_registry
          chmod 600 ~/.ssh/ci_registry
          ssh -fN -i ~/.ssh/ci_registry \
            -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -L 5000:127.0.0.1:5000 root@${{ vars.VPS_HOST }}
          timeout 15 bash -c 'until echo > /dev/tcp/127.0.0.1/5000 2>/dev/null; do sleep 1; done'

      - name: Log in to the private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login localhost:5000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Build + push ${{ matrix.app }}
        env:
          PUBLIC_JC_API_URL: ${{ vars.PUBLIC_JC_API_URL }}
          PUBLIC_JC_WS_URL: ${{ vars.PUBLIC_JC_WS_URL }}
          PUBLIC_JC_ENV: ${{ vars.PUBLIC_JC_ENV }}
          PUBLIC_JC_SITE_URL: ${{ vars.PUBLIC_JC_SITE_URL }}
          PUBLIC_JC_GLITCHTIP_DSN: ${{ vars.PUBLIC_JC_GLITCHTIP_DSN }}
          PUBLIC_MAIN_ORIGIN: ${{ vars.PUBLIC_MAIN_ORIGIN }}
          PUBLIC_ADMIN_ORIGIN: ${{ vars.PUBLIC_ADMIN_ORIGIN }}
          PUBLIC_DOCS_ORIGIN: ${{ vars.PUBLIC_DOCS_ORIGIN }}
          PUBLIC_JC_ACADEMY_ORIGIN: ${{ vars.PUBLIC_JC_ACADEMY_ORIGIN }}
          PUBLIC_JC_UMAMI_URL: ${{ vars.PUBLIC_JC_UMAMI_URL }}
          PUBLIC_JC_UMAMI_SITE_ID: ${{ vars.PUBLIC_JC_UMAMI_SITE_ID }}
          PUBLIC_JC_UMAMI_SITE_ID_ADMIN: ${{ vars.PUBLIC_JC_UMAMI_SITE_ID_ADMIN }}
          PUBLIC_JC_UMAMI_SITE_ID_CONTROL: ${{ vars.PUBLIC_JC_UMAMI_SITE_ID_CONTROL }}
          PUBLIC_JC_UMAMI_SITE_ID_ACADEMY: ${{ vars.PUBLIC_JC_UMAMI_SITE_ID_ACADEMY }}
          PUBLIC_JC_UMAMI_SITE_ID_DOCS: ${{ vars.PUBLIC_JC_UMAMI_SITE_ID_DOCS }}
        run: |
          ARGS=""
          for V in PUBLIC_JC_API_URL PUBLIC_JC_WS_URL PUBLIC_JC_ENV \
                   PUBLIC_JC_SITE_URL PUBLIC_JC_GLITCHTIP_DSN \
                   PUBLIC_MAIN_ORIGIN PUBLIC_ADMIN_ORIGIN PUBLIC_DOCS_ORIGIN \
                   PUBLIC_JC_ACADEMY_ORIGIN PUBLIC_JC_UMAMI_URL \
                   PUBLIC_JC_UMAMI_SITE_ID PUBLIC_JC_UMAMI_SITE_ID_ADMIN \
                   PUBLIC_JC_UMAMI_SITE_ID_CONTROL PUBLIC_JC_UMAMI_SITE_ID_ACADEMY \
                   PUBLIC_JC_UMAMI_SITE_ID_DOCS; do
            ARGS="$ARGS --build-arg $V=${!V}"
          done
          docker buildx build \
            --file "apps/${{ matrix.app }}/Dockerfile" \
            --tag "$IMAGE:${{ inputs.sha || github.sha }}" \
            --tag "$IMAGE:production" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,ignore-error=true" \
            --push $ARGS .

  deploy-production:
    needs: [promote-api, build-frontends]
    if: needs.promote-api.result == 'success' && needs.build-frontends.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy api
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_API }}"'

      - name: Deploy main
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_MAIN }}"'

      - name: Deploy admin
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ADMIN }}"'

      - name: Deploy control
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_CONTROL }}"'

      - name: Deploy academy
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ACADEMY }}"'

      - name: Deploy docs
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_DOCS }}"'
