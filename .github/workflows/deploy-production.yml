name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (blank = last staging build)'
        required: false
      runner:
        description: "Build runner: auto probes github, falls back to vps"
        type: choice
        options: [auto, github, vps]
        default: auto
        required: true

# Manual production deploy — the dispatch click is the promotion gate.
#
# api: the image is env-agnostic (all config is runtime JC_* env), so prod
# ships the exact digest staging ran — retagged registry-side via
# `imagetools create`, no pull, no rebuild.
#
# frontends: PUBLIC_* values are inlined at vite build time and differ
# between environments, so frontend images are built at dispatch with the
# `production` environment's variables — same source commit, prod config,
# warmed by the local buildx cache.
#
# Prod deploy webhooks live on the `production` environment's secrets:
#   COOLIFY_WEBHOOK_API, _MAIN, _ADMIN, _CONTROL, _ACADEMY, _DOCS, _TOOLS

permissions:
  contents: read

jobs:
  probe:
    # Billing-blocked hosted runners fail fast here; a long queue times
    # out after 5 min. continue-on-error keeps the run green; the `up`
    # output is only written when a hosted runner actually picked the
    # job up, which is the real signal decide reads.
    if: inputs.runner == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      up: ${{ steps.up.outputs.up }}
    steps:
      - id: up
        run: echo "up=1" >> "$GITHUB_OUTPUT"

  decide:
    # Pinned to the vps runner so it always executes even when hosted
    # runners are unavailable; every real job routes through its output.
    needs: probe
    if: always()
    runs-on: vps
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - id: decide
        env:
          CHOICE: ${{ inputs.runner }}
          PROBE: ${{ needs.probe.outputs.up }}
        run: |
          case "$CHOICE" in
            github) R=ubuntu-latest ;;
            vps) R=vps ;;
            *) [ "$PROBE" = "1" ] && R=ubuntu-latest || R=vps ;;
          esac
          echo "runner=$R" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $R (choice=$CHOICE probe=$PROBE)"

  promote-api:
    needs: decide
    if: needs.decide.result == 'success'
    runs-on: ${{ needs.decide.outputs.runner }}
    environment: production
    steps:
      - name: Log in to the private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: Retag api staging → production
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.REGISTRY_HOST }}/japa-api:production \
            ${{ vars.REGISTRY_HOST }}/japa-api:${{ inputs.sha || 'staging' }}

  build-frontends:
    needs: decide
    if: needs.decide.result == 'success'
    runs-on: ${{ needs.decide.outputs.runner }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: [main, admin, control, academy, docs, tools]
    env:
      IMAGE: ${{ vars.REGISTRY_HOST }}/japa-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Log in to the private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: Build + push ${{ matrix.app }}
        env:
          PUBLIC_JC_API_URL: ${{ vars.PUBLIC_JC_API_URL }}
          PUBLIC_JC_WS_URL: ${{ vars.PUBLIC_JC_WS_URL }}
          PUBLIC_JC_ENV: ${{ vars.PUBLIC_JC_ENV }}
          PUBLIC_JC_SITE_URL: ${{ vars.PUBLIC_JC_SITE_URL }}
          PUBLIC_JC_GLITCHTIP_DSN: ${{ vars.PUBLIC_JC_GLITCHTIP_DSN }}
          PUBLIC_MAIN_ORIGIN: ${{ vars.PUBLIC_MAIN_ORIGIN }}
          PUBLIC_ADMIN_ORIGIN: ${{ vars.PUBLIC_ADMIN_ORIGIN }}
          PUBLIC_DOCS_ORIGIN: ${{ vars.PUBLIC_DOCS_ORIGIN }}
          PUBLIC_JC_ACADEMY_ORIGIN: ${{ vars.PUBLIC_JC_ACADEMY_ORIGIN }}
          PUBLIC_JC_TOOLS_ORIGIN: ${{ vars.PUBLIC_JC_TOOLS_ORIGIN }}
        run: |
          ARGS=""
          for V in PUBLIC_JC_API_URL PUBLIC_JC_WS_URL PUBLIC_JC_ENV \
                   PUBLIC_JC_SITE_URL PUBLIC_JC_GLITCHTIP_DSN \
                   PUBLIC_MAIN_ORIGIN PUBLIC_ADMIN_ORIGIN PUBLIC_DOCS_ORIGIN \
                   PUBLIC_JC_ACADEMY_ORIGIN PUBLIC_JC_TOOLS_ORIGIN; do
            ARGS="$ARGS --build-arg $V=${!V}"
          done
          docker buildx build \
            --file "apps/${{ matrix.app }}/Dockerfile" \
            --tag "$IMAGE:${{ inputs.sha || github.sha }}" \
            --tag "$IMAGE:production" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --push $ARGS .

  deploy-production:
    needs: [decide, promote-api, build-frontends]
    if: needs.decide.result == 'success' && needs.promote-api.result == 'success' && needs.build-frontends.result == 'success'
    runs-on: ${{ needs.decide.outputs.runner }}
    environment: production
    steps:
      - name: Deploy api
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_API }}"'

      - name: Deploy main
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_MAIN }}"'

      - name: Deploy admin
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ADMIN }}"'

      - name: Deploy control
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_CONTROL }}"'

      - name: Deploy academy
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ACADEMY }}"'

      - name: Deploy docs
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_DOCS }}"'

      - name: Deploy tools
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_TOOLS }}"'
