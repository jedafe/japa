name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m

  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [main, admin, control, academy, docs, tools, studio-desktop]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # .env is gitignored; $env/static/public vars are inlined at build
      # time, so an incomplete env contract fails the build. .env.example
      # documents the full contract per app and doubles as the CI env.
      - name: Provision env from example
        run: cp .env.example .env

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  # WXT extension: no vitest suite — type check + wxt build only.
  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision env from example
        run: cp .env.example .env

      - name: WXT prepare
        run: bunx wxt prepare

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s -race

      - name: Run tests with coverage
        run: go test ./... -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
