name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore: ['docs/**', '**.md', '.github/**', '.jeos/**', 'dumps/**']
  pull_request:
    branches: [main, staging]
    paths-ignore: ['docs/**', '**.md', '.github/**', '.jeos/**', 'dumps/**']
  workflow_dispatch:

permissions:
  contents: read

# CI is opt-in on push: jobs only run when the head commit message
# contains '[ci]' (PRs and manual dispatch always run).
jobs:
  lint:
    name: Lint
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for new-from-merge-base ratchet

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  build:
    name: Build & Vet
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend (${{ matrix.app }})
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    env:
      # svelte-check on apps/main exceeds the default ~2GB node heap.
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        app: [main, admin, control, academy, docs, studio-desktop]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Warm dep store for hosted runners (no-op cost on self-hosted,
      # whose disk persists anyway).
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # .env is gitignored; $env/static/public vars are inlined at build
      # time, so an incomplete env contract fails the build. .env.example
      # documents the full contract per app and doubles as the CI env.
      - name: Provision env from example
        run: cp .env.example .env

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      # adapter-node externalizes each app's `dependencies` — every bare
      # import in the bundle must be declared, or it 500s in production
      # (bun's isolated node_modules hides undeclared transitives).
      # Skips apps without build/ (adapter-static: control, studio-desktop).
      - name: Check runtime imports
        working-directory: .
        run: python3 scripts/check_runtime_imports.py apps/${{ matrix.app }}
  extension:
    name: Extension
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision env from example
        run: cp .env.example .env

      - name: WXT prepare
        run: bunx wxt prepare

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

  test:
    name: Test
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s -race

      - name: Run tests with coverage
        run: go test ./... -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
