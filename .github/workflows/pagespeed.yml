name: PageSpeed

# Weekly PageSpeed/Lighthouse audit of the public frontends
# (japa.to, docs.japa.to, academy.japa.to). Reports upload as artifacts;
# nothing fails unless a dispatch sets a perf floor.
#
# Set the JC_PAGESPEED_API_KEY repo secret to use the PageSpeed Insights
# API (adds CrUX field data). Without it the job falls back to the
# Lighthouse CLI on the hosted runner's bundled Chrome — same lab scores.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      fail-under:
        description: 'Fail if any performance score is below this (0-100, empty = report only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: PageSpeed audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run audits
        env:
          JC_PAGESPEED_API_KEY: ${{ secrets.JC_PAGESPEED_API_KEY }}
        run: |
          args=""
          if [ -n "${{ inputs.fail-under }}" ]; then
            args="--fail-under ${{ inputs.fail-under }}"
          fi
          bun scripts/pagespeed.ts $args

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pagespeed-reports
          path: reports/pagespeed/
          retention-days: 90
