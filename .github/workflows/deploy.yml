name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (comma list, or 'changed', or 'all')"
        required: false
        default: changed
      base:
        description: "Base ref for change detection (default: last deployed commit)"
        required: false
      runner:
        description: "Build runner: auto probes github, falls back to vps"
        type: choice
        options: [auto, github, vps]
        default: auto
        required: true

# Manual staging deploy. Builds each app image on the selected runner
# (auto: GitHub-hosted when reachable, else the Coolify host's `vps`
# runner — see probe/decide jobs) and pushes to the private registry
# on the Coolify host; the deploy job then calls each app's Coolify
# webhook which pulls + redeploys the :staging tag.
#
# Change detection: 'changed' (default) diffs against `base` input, or
# the commit recorded by the last successful staging deploy
# (LAST_DEPLOYED_SHA repo variable, updated on success).
#
# Registry config (repo/environment vars + secrets):
#   vars.REGISTRY_HOST          — e.g. registry.japa.to
#   secrets.REGISTRY_USERNAME   — htpasswd user
#   secrets.REGISTRY_PASSWORD   — htpasswd password
#
# Staging deploy webhooks live on the `staging` environment's secrets:
#   COOLIFY_WEBHOOK_API_STAGING, _MAIN_, _ADMIN_, _CONTROL_, _ACADEMY_,
#   _DOCS_, _TOOLS_STAGING
#
# Production is a separate manual workflow (deploy-production.yml).

permissions:
  contents: read

jobs:
  probe:
    # Billing-blocked hosted runners fail fast here; a long queue times
    # out after 5 min. continue-on-error keeps the run green; the `up`
    # output is only written when a hosted runner actually picked the
    # job up, which is the real signal decide reads.
    if: inputs.runner == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      up: ${{ steps.up.outputs.up }}
    steps:
      - id: up
        run: echo "up=1" >> "$GITHUB_OUTPUT"

  decide:
    # Pinned to the vps runner so it always executes even when hosted
    # runners are unavailable; every real job routes through its output.
    needs: probe
    if: always()
    runs-on: vps
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - id: decide
        env:
          CHOICE: ${{ inputs.runner }}
          PROBE: ${{ needs.probe.outputs.up }}
        run: |
          case "$CHOICE" in
            github) R=ubuntu-latest ;;
            vps) R=vps ;;
            *) [ "$PROBE" = "1" ] && R=ubuntu-latest || R=vps ;;
          esac
          echo "runner=$R" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $R (choice=$CHOICE probe=$PROBE)"

  filter:
    needs: decide
    if: needs.decide.result == 'success'
    runs-on: ${{ needs.decide.outputs.runner }}
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      changed: ${{ steps.filter.outputs.changes }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: base
        run: |
          B="${{ inputs.base }}"
          if [ -z "$B" ]; then
            B=$(gh variable get LAST_DEPLOYED_SHA 2>/dev/null || git rev-parse HEAD~1)
          fi
          echo "base=$B" >> "$GITHUB_OUTPUT"
          echo "diff base: $B"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: inputs.apps == 'changed' || inputs.apps == ''
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            api:
              - 'Dockerfile'
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'packages/**'
              - 'bun.lock'
            main:
              - 'bun.lock'
              - 'packages/**'
              - 'apps/main/**'
            admin:
              - 'bun.lock'
              - 'packages/**'
              - 'apps/admin/**'
            control:
              - 'bun.lock'
              - 'packages/**'
              - 'apps/control/**'
            academy:
              - 'bun.lock'
              - 'packages/**'
              - 'apps/academy/**'
            docs:
              - 'bun.lock'
              - 'packages/**'
              - 'apps/docs/**'
      - id: pick
        run: |
          ALL='["api","main","admin","control","academy","docs"]'
          case "${{ inputs.apps }}" in
            all)
              echo "apps=$ALL" >> "$GITHUB_OUTPUT";;
            changed|'')
              CHANGES='${{ steps.filter.outputs.changes }}'
              echo "apps=${CHANGES:-[]}" >> "$GITHUB_OUTPUT";;
            *)
              LIST=$(echo "${{ inputs.apps }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed 's/^/"/;s/$/"/' | paste -sd,)
              echo "apps=[$LIST]" >> "$GITHUB_OUTPUT";;
          esac

  build-images:
    needs: [decide, filter]
    if: needs.decide.result == 'success' && needs.filter.outputs.apps != '[]'
    runs-on: ${{ needs.decide.outputs.runner }}
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.filter.outputs.apps) }}
    env:
      IMAGE: ${{ vars.REGISTRY_HOST }}/japa-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
      - name: Build args (staging PUBLIC_* vars)
        id: args
        env:
          PUBLIC_JC_API_URL: ${{ vars.PUBLIC_JC_API_URL }}
          PUBLIC_JC_WS_URL: ${{ vars.PUBLIC_JC_WS_URL }}
          PUBLIC_JC_ENV: ${{ vars.PUBLIC_JC_ENV }}
          PUBLIC_JC_SITE_URL: ${{ vars.PUBLIC_JC_SITE_URL }}
          PUBLIC_JC_GLITCHTIP_DSN: ${{ vars.PUBLIC_JC_GLITCHTIP_DSN }}
          PUBLIC_MAIN_ORIGIN: ${{ vars.PUBLIC_MAIN_ORIGIN }}
          PUBLIC_ADMIN_ORIGIN: ${{ vars.PUBLIC_ADMIN_ORIGIN }}
          PUBLIC_DOCS_ORIGIN: ${{ vars.PUBLIC_DOCS_ORIGIN }}
          PUBLIC_JC_ACADEMY_ORIGIN: ${{ vars.PUBLIC_JC_ACADEMY_ORIGIN }}
          PUBLIC_JC_TOOLS_ORIGIN: ${{ vars.PUBLIC_JC_TOOLS_ORIGIN }}
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          A=""
          for v in PUBLIC_JC_API_URL PUBLIC_JC_WS_URL PUBLIC_JC_ENV PUBLIC_JC_SITE_URL \
                   PUBLIC_JC_GLITCHTIP_DSN PUBLIC_MAIN_ORIGIN PUBLIC_ADMIN_ORIGIN \
                   PUBLIC_DOCS_ORIGIN PUBLIC_JC_ACADEMY_ORIGIN PUBLIC_JC_TOOLS_ORIGIN; do
            A="$A --build-arg $v=${!v}"
          done
          echo "args=$A" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build + push
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then DOCKERFILE=Dockerfile; else DOCKERFILE=apps/${{ matrix.app }}/Dockerfile; fi
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:staging" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --push ${{ steps.args.outputs.args }} .

  deploy-staging:
    needs: [decide, filter, build-images]
    if: needs.decide.result == 'success' && needs.build-images.result == 'success'
    runs-on: ${{ needs.decide.outputs.runner }}
    environment: staging
    steps:
      - name: Deploy api
        if: contains(needs.filter.outputs.apps, 'api')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_API_STAGING }}"'
      - name: Deploy main
        if: contains(needs.filter.outputs.apps, 'main')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_MAIN_STAGING }}"'
      - name: Deploy admin
        if: contains(needs.filter.outputs.apps, 'admin')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ADMIN_STAGING }}"'
      - name: Deploy control
        if: contains(needs.filter.outputs.apps, 'control')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_CONTROL_STAGING }}"'
      - name: Deploy academy
        if: contains(needs.filter.outputs.apps, 'academy')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_ACADEMY_STAGING }}"'
      - name: Deploy docs
        if: contains(needs.filter.outputs.apps, 'docs')
        run: 'curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_DOCS_STAGING }}"'      - name: Record deployed SHA
        run: gh variable set LAST_DEPLOYED_SHA --body "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
