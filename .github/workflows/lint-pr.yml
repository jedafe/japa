name: Lint PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr:
    name: PR Title & Lint
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint (changed files only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --new-from-rev=HEAD~1 --timeout=5m
