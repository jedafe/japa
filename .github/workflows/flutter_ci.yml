name: Flutter CI

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/japaconnect_core/**']
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/japaconnect_core/**']

jobs:
  build-and-test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/pubspec.yaml
      - run: flutter pub get
        working-directory: packages/japaconnect_core
      - run: flutter analyze
        working-directory: packages/japaconnect_core
      - run: flutter test
        working-directory: packages/japaconnect_core
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
