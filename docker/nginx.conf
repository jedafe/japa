# docker/nginx.conf — basic reverse proxy configuration for local development.
#
# In production this would include TLS termination, rate limiting, and
# caching directives. For the foundation, it simply proxies all API
# requests to the Go API service.

upstream japa_api {
    server go-api:8080;
}

server {
    listen 80;
    server_name _;

    # API routes — proxy to the Go API.
    location / {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Health and readiness probes — proxy directly, no caching.
    location /health {
        proxy_pass http://japa_api;
        access_log off;
    }

    location /ready {
        proxy_pass http://japa_api;
        access_log off;
    }
}
