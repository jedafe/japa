# Tools surface — SvelteKit SSR identity tools (ADR-086, §78).
# Canonical hub host: tools.japa.to. Per-tool subdomains and any
# configured custom domains also proxy here; the app's hooks.server.ts
# resolves the host → toolSurface and renders the appropriate shell.
server {
    listen 80;
    server_name tools.japa.to
               visa-checklist.japa.to
               readiness.japa.to
               cost-of-living.japa.to
               scholarships.japa.to
               remittance.japa.to
               japabot.japa.to;

    resolver 127.0.0.11 valid=5s;

    # API routes on the tools subdomain proxy to the Go API (not the tools app).
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $tools_app http://tools:3005;
        proxy_pass $tools_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
