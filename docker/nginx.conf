# docker/nginx.conf — reverse proxy for local dev / Coolify preview.
#
# Host-based routing for every JapaConnect surface. /api/* on any host goes to
# the Go API; everything else goes to the surface's SvelteKit app. App
# upstreams are resolved lazily via the Docker embedded DNS resolver so nginx
# starts even when a frontend service is down (returns 502 instead of
# crash-looping).

proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;

# SvelteKit SSR responses carry large `link: rel=preload` headers (~8 KB on
# main/admin) that overflow nginx's default 4k/8k proxy header buffer (502).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

upstream japa_api {
    server go-api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge CDN real-IP restore (ADR-134): when the site is fronted by
# Cloudflare, the immediate peer is a CF edge IP and the true client IP
# arrives in CF-Connecting-IP. set_real_ip_from whitelists the published
# Cloudflare ranges (https://www.cloudflare.com/ips/ — keep in sync) so the
# header is honoured only from their edges; direct traffic keeps
# $remote_addr untouched, and JC_TRUSTED_PROXIES gates the Go app's own
# forwarding-header trust. BunnyCDN sets X-Forwarded-For correctly, so it
# needs no dedicated directive.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

server {
    listen 80;
    server_name api.japa.to;

    location / {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Default server — the public site (apps/main SSR) plus API and SEO endpoints.
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=5s;

    # Immutable hashed SvelteKit bundles — adapter-node emits
    # max-age=31536000 + immutable; let that reach browsers and the edge CDN
    # (ADR-134) instead of being capped by the generic static rule below.
    location ^~ /_app/immutable/ {
        set $main_app http://main:3000;
        proxy_pass $main_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching — proxies to the main app. API, OAuth, swagger,
    # and og-image paths are excluded so they still reach their own
    # handlers; without those exclusions og/*.png would land here.
    location ~* ^/(?!api/|oauth/|developer/|og/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        set $main_app http://main:3000;
        proxy_pass $main_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # API caching for read-only endpoints
    location ~ ^/api/v1/(translations|feature-flags|tags|categories|posts|reviews) {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Credentialed requests bypass AND skip the shared cache — the
        # cache key is URL-only, so a response personalized for a bearer/
        # API-key/session caller would otherwise be served to anonymous
        # requests (and a keyed caller could read a stale anon response).
        proxy_cache_bypass $http_authorization $http_x_api_key $cookie_jc_token;
        proxy_no_cache $http_authorization $http_x_api_key $cookie_jc_token;

        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API routes (mutations + websockets) — proxy to the Go API, no caching.
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # §120 OAuth endpoints on the site host — the browser extension's
    # "Login with JapaConnect" flow (§47 v1.4) hits {site}/oauth/* so the
    # jc_token session cookie is same-origin for /oauth/authorize. Machine
    # endpoints (register/token/revoke/userinfo) work identically here.
    location /oauth/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }

    # SEO/feed endpoints served by the Go API.
    location ~ ^/(robots\.txt|llms(-full)?\.txt|sitemap[^/]*\.xml|og/.*\.png|feed\.xml|spaces/[^/]+/feed\.xml|tags/[^/]+/feed\.xml|users/[^/]+/feed\.xml|site/settings/public) {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://japa_api/health;
        access_log off;
    }

    location /ready {
        proxy_pass http://japa_api/ready;
        access_log off;
    }

    # Everything else → the Main SvelteKit app.
    location / {
        set $main_app http://main:3000;
        proxy_pass $main_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

# Public imgproxy endpoint (ADR-134) — front this host with the configured
# edge CDN and point media.cdn.base_url at it. imgproxy only serves signed
# URLs (JC_IMGPROXY_KEY/SALT), so exposing it carries no open-proxy risk.
server {
    listen 80;
    server_name img.japa.to;

    resolver 127.0.0.11 valid=5s;

    location / {
        set $imgproxy http://imgproxy:8080;
        proxy_pass $imgproxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $imgproxy http://imgproxy:8080;
        proxy_pass $imgproxy;
        access_log off;
    }
}

# ── Surface vhosts ───────────────────────────────────────────────────────────
# Pattern: /api/ + /health → Go API, everything else → the surface's app.

# Academy — the unified learning + creator marketplace surface.
server {
    listen 80;
    server_name academy.japa.to;

    resolver 127.0.0.11 valid=5s;

    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $academy_app http://academy:3003;
        proxy_pass $academy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Legacy surface hosts → Academy.
server {
    listen 80;
    server_name learn.japa.to university.japa.to;
    return 308 $scheme://academy.japa.to$request_uri;
}

