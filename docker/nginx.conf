# Tools surface — SvelteKit SSR identity tools (ADR-086, §78).
# Former dedicated tools surface (apps/tools removed; ADR-086 superseded).
# tools.japa.to and the per-tool subdomains 301 to the canonical
# japa.to/tools/{tool} routes on the main app — indexed URLs and backlinks
# consolidate instead of 404ing. /api/ keeps proxying for any tools-surface
# clients still pointed at these hosts.
server {
    listen 80;
    server_name tools.japa.to
               visa-checklist.japa.to
               readiness.japa.to
               cost-of-living.japa.to
               scholarships.japa.to
               remittance.japa.to
               japabot.japa.to;

    resolver 127.0.0.11 valid=5s;

    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Slug renames between the old surface and the in-app routes.
    location = /processing-times/my-applications { return 301 https://japa.to/tools/processing-tracker/my-applications$is_args$args; }
    location ~ ^/processing-times { return 301 https://japa.to/tools/processing-tracker$is_args$args; }
    location ~ ^/japabot { return 301 https://japa.to/ai$is_args$args; }

    location / {
        return 301 https://japa.to/tools$request_uri;
    }
}
