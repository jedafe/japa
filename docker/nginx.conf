# docker/nginx.conf — reverse proxy for local dev / Coolify preview.
#
# Host-based routing for every JapaConnect surface. /api/* on any host goes to
# the Go API; everything else goes to the surface's SvelteKit app. App
# upstreams are resolved lazily via the Docker embedded DNS resolver so nginx
# starts even when a frontend service is down (returns 502 instead of
# crash-looping).

proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;

upstream japa_api {
    server go-api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.japaconnect.com;

    location / {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Default server — the public site (apps/main SSR) plus API and SEO endpoints.
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=5s;

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        access_log off;
    }

    # API caching for read-only endpoints
    location ~ ^/api/v1/(translations|feature-flags|tags|categories|posts|reviews) {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API routes (mutations + websockets) — proxy to the Go API, no caching.
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SEO/feed endpoints served by the Go API.
    location ~ ^/(robots\.txt|llms(-full)?\.txt|sitemap[^/]*\.xml|og/.*\.png|feed\.xml|spaces/[^/]+/feed\.xml|tags/[^/]+/feed\.xml|users/[^/]+/feed\.xml|site/settings/public) {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://japa_api/health;
        access_log off;
    }

    location /ready {
        proxy_pass http://japa_api/ready;
        access_log off;
    }

    # Everything else → the Main SvelteKit app.
    location / {
        set $main_app http://main:3000;
        proxy_pass $main_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

# ── Surface vhosts ───────────────────────────────────────────────────────────
# Pattern: /api/ + /health → Go API, everything else → the surface's app.

# Academy — the unified learning + creator marketplace surface.
server {
    listen 80;
    server_name academy.japaconnect.com;

    resolver 127.0.0.11 valid=5s;

    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $academy_app http://academy:3003;
        proxy_pass $academy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Legacy surface hosts → Academy.
server {
    listen 80;
    server_name learn.japaconnect.com university.japaconnect.com;
    return 308 $scheme://academy.japaconnect.com$request_uri;
}

