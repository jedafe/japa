# docker/nginx.conf — basic reverse proxy configuration for local development.
#
# In production this would include TLS termination, rate limiting, and
# caching directives. For the foundation, it simply proxies all API
# requests to the Go API service.

proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;

upstream japa_api {
    server go-api:8080;
}

upstream japa_jce {
    server jce:3006;
}

# Default catch-all server (responds to any Host header).
server {
    listen 80;
    server_name _;

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        access_log off;
    }

    # API caching for read-only endpoints
    location ~ ^/api/v1/(translations|feature-flags|tags|categories|posts|reviews) {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API routes — proxy to the Go API (mutations, no caching).
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }

    # Japa Comparison Engine — /compare and /comparisons pages.
    location ~ ^/(compare|comparisons) {
        proxy_pass http://japa_jce;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Catch-all proxy for non-API routes.
    location / {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Health and readiness probes — proxy directly, no caching.
    location /health {
        proxy_pass http://japa_api;
        access_log off;
    }

    location /ready {
        proxy_pass http://japa_api;
        access_log off;
    }
}

# Dedicated API virtual host (api.japaconnect.com).
server {
    listen 80;
    server_name api.japaconnect.com;

    location / {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI — restricted CSP for inline scripts.
    location /docs {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }

    location /health {
        proxy_pass http://japa_api/health;
        access_log off;
    }
}

# Tools surface — SvelteKit SSR identity tools (ADR-086, §78).
# Canonical hub host: tools.japaconnect.com. Per-tool subdomains
# (visa-checklist., readiness., cost-of-living., scholarships., remittance.,
# japabot.) and any configured custom domains also proxy here; the SvelteKit
# app's hooks.server.ts resolves the host → toolSurface and renders the
# appropriate shell (hub vs single-tool).
upstream japa_tools {
    server tools:3005;
}

server {
    listen 80;
    server_name tools.japaconnect.com
               visa-checklist.japaconnect.com
               readiness.japaconnect.com
               cost-of-living.japaconnect.com
               scholarships.japaconnect.com
               remittance.japaconnect.com
               japabot.japaconnect.com;

    location / {
        proxy_pass http://japa_tools;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API routes on the tools subdomain proxy to the Go API (not the tools app).
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }

    location /health {
        proxy_pass http://japa_tools;
        access_log off;
    }
}

# Japa Comparison Engine surface (ADR-088, §30).
# Canonical host: jce.japaconnect.com. /compare and /comparisons paths
# are also served on the main domain via the catch-all server above.
server {
    listen 80;
    server_name jce.japaconnect.com;

    location / {
        proxy_pass http://japa_jce;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API routes on the JCE subdomain proxy to the Go API (not the JCE app).
    location /api/ {
        proxy_pass http://japa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }

    location /health {
        proxy_pass http://japa_jce;
        access_log off;
    }
}
