version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
  # Ratchet: ~3.9k pre-existing findings (2026-10-16 audit) are tracked in
  # .jeos/audit/backend-audit.md for a dedicated cleanup campaign. Gate only
  # issues introduced since origin/main so CI enforces the bar going forward
  # without blocking on the backlog. Requires fetch-depth: 0 in CI.
  new-from-merge-base: origin/main

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - wsl_v5
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security & resources
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # logging
    - sloglint
    - loggercheck
    # testing
    - testifylint
    - thelper
    - usetesting
    - paralleltest
    # modernization & meta
    - exptostd
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint

  disable:
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - iface
    - nakedret
    - gocognit
    - cyclop
    - depguard
    - goheader
    - importas
    - funcorder
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - makezero
    - testpackage
    - recvcheck
    - mirror
    - protogetter
    - spancheck
    - zerologlint

  exclusions:
    generated: lax
    rules:
      # internal/worker tests mutate package-level singletons registered via
      # RegisterX calls (agentDraftProcessor, jceService, contentEmbedder,
      # intelStores, taskEnqueuer, ...), so they cannot run in parallel without
      # refactoring the package's global-state design. Forcing t.Parallel
      # there produces real data races, so paralleltest is scoped out.
      - linters:
          - paralleltest
        path: internal/worker
    paths:
      - vendor$
      - third_party$
      - testutils$
      - examples$
      - internal/db/gen$

  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13
    nolintlint:
      require-explanation: true
      require-specific: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
