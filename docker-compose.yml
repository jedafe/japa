# docker-compose.yml — all services for JapaConnect local development.
#
# Usage:
#   make docker-up     # start all services
#   make docker-down   # stop all services
#
# The Go API is built from the Dockerfile in the project root. Other
# services use official images. Data is persisted in named volumes so
# it survives container restarts.

services:
  # PostgreSQL 18 with pgvector extension for vector similarity search.
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: japa
      POSTGRES_PASSWORD: japa
      POSTGRES_DB: japa
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japa -d japa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey 9 — BSD-licensed Redis-protocol cache and Asynq queue backing.
  valkey:
    image: valkey/valkey:9-alpine
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Meilisearch 1.45 — full-text search engine.
  meilisearch:
    image: getmeili/meilisearch:v1.45
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: development-key
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — S3-compatible object storage for file uploads (avatars, media).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: japa
      MINIO_ROOT_PASSWORD: japa-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO init — creates default buckets on first boot, then exits.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 japa japa-secret &&
      mc mb local/japa-uploads --ignore-existing &&
      mc mb local/japa-avatars --ignore-existing &&
      mc mb local/japa-media --ignore-existing &&
      echo 'Buckets created successfully'
      "

  # imgproxy — image processing and resizing (internal only, not exposed).
  imgproxy:
    image: darthsim/imgproxy
    environment:
      IMGPROXY_KEY: development-key
      IMGPROXY_SALT: development-salt
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Mailpit — local development SMTP server with web UI for viewing emails.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Go API — the JapaConnect backend, built from the Dockerfile.
  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JC_DATABASE_URL: postgresql://japa:japa@postgres:5432/japa?sslmode=disable
      JC_REDIS_ADDR: valkey:6379
      JC_MEILISEARCH_URL: http://meilisearch:7700
      JC_MEILISEARCH_KEY: development-key
      JC_IMGPROXY_BASE_URL: http://imgproxy:8080
      JC_HONCHO_URL: http://honcho:8000
      JC_RELEASE_SHA: dev
      JC_ENV: development
      JC_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Nginx — reverse proxy in front of the Go API.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go-api
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  meili-data:
  minio-data:
