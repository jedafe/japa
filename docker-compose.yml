# docker-compose.yml — all services for JapaConnect local development.
#
# DEV ONLY — do not run this file on a reachable host. Postgres uses
# trust auth and several images carry floating tags; every published port
# is bound to 127.0.0.1 for that reason. For production, pin image digests
# and use real auth/network controls.
#
# Usage:
#   make docker-up     # start all services
#   make docker-down   # stop all services
#
# The Go API is built from the Dockerfile in the project root. Other
# services use official images. Data is persisted in named volumes so
# it survives container restarts.

services:
  # PostgreSQL 18 with pgvector extension for vector similarity search.
  # Primary — all writes go here. Replication settings (wal_level, max_wal_senders)
  # enable the read replica below. POSTGRES_HOST_AUTH_METHOD=trust is dev-only;
  # production should use md5 + proper pg_hba.conf replication rules.
  #
  # Image note (docker-library/postgres#1259): the 18+ images store data in a
  # versioned pg_ctlcluster-style dir — PGDATA defaults to
  # /var/lib/postgresql/18/docker — and refuse to boot when a legacy flat
  # /var/lib/postgresql/data cluster exists. The volume correctly mounts at
  # /var/lib/postgresql; to migrate an older volume run once:
  #   docker run --rm -v <project>_postgres-data:/var/lib/postgresql \
  #     pgvector/pgvector:pg18 \
  #     bash -c "mkdir -p /var/lib/postgresql/18 && mv /var/lib/postgresql/data /var/lib/postgresql/18/docker"
  postgres:
    image: pgvector/pgvector:pg18
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on
    environment:
      POSTGRES_USER: japa
      POSTGRES_PASSWORD: japa
      POSTGRES_DB: japa
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres-init-replication.sh:/docker-entrypoint-initdb.d/02-replication-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japa -d japa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgreSQL read replica — receives all read traffic when JC_DATABASE_READER_URL
  # is set on the go-api service. Streams WAL from the primary via pg_basebackup +
  # streaming replication. Dev-only setup (trust auth); production should use
  # proper pg_hba.conf rules and password auth.
  postgres-replica:
    image: pgvector/pgvector:pg18
    entrypoint: ["/usr/local/bin/postgres-replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
      REPLICA_USER: replicator
      REPLICA_PASSWORD: japa_replica
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./docker/postgres-replica-entrypoint.sh:/usr/local/bin/postgres-replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japa -d japa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey 9 — BSD-licensed Redis-protocol cache and Asynq queue backing.
  valkey:
    image: valkey/valkey:9-alpine
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Meilisearch 1.45 — full-text search engine.
  meilisearch:
    image: getmeili/meilisearch:v1.45
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${JC_MEILISEARCH_KEY}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS 4.x — S3-compatible object storage for file uploads (Apache 2.0).
  # `weed server` runs the volume + master servers; -s3 enables the S3 API.
  seaweedfs:
    image: chrislusf/seaweedfs:4.02
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # imgproxy — image processing and resizing (internal only, not exposed).
  imgproxy:
    image: darthsim/imgproxy:v4.0.18
    environment:
      IMGPROXY_KEY: ${JC_IMGPROXY_KEY}
      IMGPROXY_SALT: ${JC_IMGPROXY_SALT}
    ports:
      - "127.0.0.1:8099:8080"
    restart: unless-stopped

  # Honcho (AI agent memory) is intentionally NOT part of the compose stack —
  # its image is not published to a registry. The API degrades gracefully when
  # JC_HONCHO_URL is unset; point it at an external Honcho deployment to enable
  # persona memory features.

  # GlitchTip — Sentry-compatible error reporting (self-hosted).
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    environment:
      DATABASE_URL: postgresql://japa:japa@postgres:5432/glitchtip?sslmode=disable
      REDIS_URL: redis://valkey:6379/1
      SECRET_KEY: ${JC_GLITCHTIP_SECRET_KEY:-dev-secret-key}
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Umami — self-hosted, privacy-first page-view analytics (Section 40, ADR-040).
  # Uses the existing PostgreSQL 18 instance with a dedicated `umami` database.
  # Default Umami dashboard login is admin/umami on first boot; change immediately.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    environment:
      DATABASE_URL: postgresql://japa:japa@postgres:5432/umami?sslmode=disable
      DATABASE_TYPE: postgresql
      APP_SECRET: ${JC_UMAMI_APP_SECRET:-dev-umami-secret-change-me}
      PORT: "3000"
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Mailpit — local development SMTP server with web UI for viewing emails.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Go API — the JapaConnect backend, built from the Dockerfile.
  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JC_DATABASE_URL: postgresql://japa:japa@postgres:5432/japa?sslmode=disable
      JC_DATABASE_READER_URL: postgresql://japa:japa@postgres-replica:5432/japa?sslmode=disable
      # Read queries use the replica; writes use the primary (above).
      # To disable the replica, comment out JC_DATABASE_READER_URL — both
      # pools will then use JC_DATABASE_URL.
      JC_REDIS_ADDR: valkey:6379
      JC_MEILISEARCH_URL: http://meilisearch:7700
      JC_MEILISEARCH_KEY: ${JC_MEILISEARCH_KEY}
      JC_IMGPROXY_BASE_URL: http://imgproxy:8080
      JC_RELEASE_SHA: dev
      JC_ENV: development
      JC_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Nginx — reverse proxy in front of the Go API.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go-api
    restart: unless-stopped

  # ── Frontend apps ──────────────────────────────────────────────────────────
  # All SvelteKit apps are built from the repository root so bun can resolve
  # workspace:* dependencies (packages/ui, packages/api-url, ...). PUBLIC_*
  # values are inlined by vite at build time — they are build args, not runtime
  # env. PRIVATE_* values are read at runtime by the SSR server.

  # Main site — SvelteKit SSR, port 3000.
  main:
    build:
      context: .
      dockerfile: apps/main/Dockerfile
      args:
        PUBLIC_JC_API_URL: http://localhost:8080/api/v1
        PUBLIC_JC_WS_URL: ws://localhost:8080/api/v1/ws
        PUBLIC_JC_ACADEMY_ORIGIN: http://localhost:3003
        PUBLIC_DOCS_ORIGIN: http://localhost:3004
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PRIVATE_API_BASE_URL=http://go-api:8080
    restart: unless-stopped

  # Admin Panel — SvelteKit, port 3001.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        PUBLIC_JC_API_URL: http://localhost:8080/api/v1
        PUBLIC_JC_WS_URL: ws://localhost:8080/api/v1/ws
        PUBLIC_JC_ENV: development
        PUBLIC_JC_SITE_URL: http://localhost
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PRIVATE_API_BASE_URL=http://go-api:8080
    restart: unless-stopped

  # Control Panel — SvelteKit SPA for internal admin tooling, port 3002.
  control:
    build:
      context: .
      dockerfile: apps/control/Dockerfile
      args:
        PUBLIC_JC_API_URL: http://localhost:8080/api/v1
        PUBLIC_JC_ENV: development
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - PRIVATE_API_BASE_URL=http://go-api:8080
      - PUBLIC_JC_UMAMI_URL=${PUBLIC_JC_UMAMI_URL}
      - PUBLIC_JC_UMAMI_SITE_ID_CONTROL=${PUBLIC_JC_UMAMI_SITE_ID_CONTROL}
    restart: unless-stopped

  # Academy — SvelteKit SSR learning + creator marketplace, port 3003.
  academy:
    build:
      context: .
      dockerfile: apps/academy/Dockerfile
      args:
        PUBLIC_JC_API_URL: http://localhost:8080/api/v1
        PUBLIC_MAIN_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - PRIVATE_API_BASE_URL=http://go-api:8080
      - PUBLIC_JC_UMAMI_URL=${PUBLIC_JC_UMAMI_URL}
      - PUBLIC_JC_UMAMI_SITE_ID_ACADEMY=${PUBLIC_JC_UMAMI_SITE_ID_ACADEMY}
    restart: unless-stopped

  # Docs — SvelteKit SSR documentation site, port 3004.
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        PUBLIC_JC_API_URL: http://localhost:8080/api/v1
        PUBLIC_MAIN_ORIGIN: http://localhost:3000
        PUBLIC_ADMIN_ORIGIN: http://localhost:3001
        PUBLIC_DOCS_ORIGIN: http://localhost:3004
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - PRIVATE_API_BASE_URL=http://go-api:8080
      - PUBLIC_JC_UMAMI_URL=${PUBLIC_JC_UMAMI_URL}
      - PUBLIC_JC_UMAMI_SITE_ID_DOCS=${PUBLIC_JC_UMAMI_SITE_ID_DOCS}
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-replica-data:
  valkey-data:
  meili-data:
  seaweedfs-data:
