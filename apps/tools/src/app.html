<!doctype html>
<html lang="en" data-theme="%jc.theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="%jc.theme-color%" />
		%sveltekit.head%
		<!-- Umami analytics — Tools surface (§40, §78). Only loads when
		     PUBLIC_JC_UMAMI_SITE_ID_TOOLS and PUBLIC_JC_UMAMI_URL are set.
		     The script is injected by +layout.svelte via svelte:head. -->
		<style id="jc-theme-overrides" nonce="%sveltekit.nonce%">%jc.themevars%</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
