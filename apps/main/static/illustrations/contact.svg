<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Envelope with conversation bubbles">
  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1FE"/>
      <stop offset="1" stop-color="#FDF3E3"/>
    </linearGradient>
  </defs>

  <rect x="40" y="30" width="560" height="420" rx="48" fill="url(#contactBg)"/>
  <circle cx="120" cy="380" r="11" fill="#C9D3F8"/>
  <circle cx="532" cy="110" r="9" fill="#F6C76B"/>

  <!-- envelope body -->
  <rect x="170" y="176" width="300" height="196" rx="20" fill="#fff" stroke="#3B49DF" stroke-width="6"/>
  <!-- envelope flap -->
  <path d="M170 196 L320 296 L470 196" fill="none" stroke="#3B49DF" stroke-width="6" stroke-linejoin="round"/>
  <path d="M170 372 L268 288 M470 372 L372 288" fill="none" stroke="#C9D3F8" stroke-width="5"/>

  <!-- speech bubble top-right -->
  <g transform="translate(392 88)">
    <rect x="0" y="0" width="150" height="92" rx="22" fill="#3B49DF"/>
    <path d="M22 92 L40 118 L58 92 Z" fill="#3B49DF"/>
    <circle cx="40" cy="46" r="9" fill="#fff"/>
    <circle cx="75" cy="46" r="9" fill="#fff"/>
    <circle cx="110" cy="46" r="9" fill="#fff"/>
  </g>

  <!-- small reply bubble -->
  <g transform="translate(120 96)">
    <rect x="0" y="0" width="120" height="72" rx="18" fill="#fff" stroke="#22B573" stroke-width="5"/>
    <path d="M96 72 L80 96 L64 72 Z" fill="#fff" stroke="#22B573" stroke-width="5" stroke-linejoin="round"/>
    <rect x="22" y="24" width="76" height="8" rx="4" fill="#22B573"/>
    <rect x="22" y="42" width="52" height="8" rx="4" fill="#BEE6CD"/>
  </g>

  <!-- notification dot -->
  <circle cx="470" cy="176" r="18" fill="#E23D5B"/>
  <circle cx="470" cy="176" r="8" fill="#fff"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="404" rx="150" ry="12" fill="#DDE3FA"/>
</svg>
