<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Question and answer speech bubbles">
  <defs>
    <linearGradient id="faqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5EE"/>
      <stop offset="1" stop-color="#EEF1FE"/>
    </linearGradient>
  </defs>

  <rect x="40" y="30" width="560" height="420" rx="48" fill="url(#faqBg)"/>
  <circle cx="108" cy="104" r="10" fill="#BEE6CD"/>
  <circle cx="536" cy="386" r="11" fill="#C9D3F8"/>

  <!-- question bubble -->
  <g transform="translate(150 110)">
    <path d="M0 0 h180 a36 36 0 0 1 36 36 v56 a36 36 0 0 1 -36 36 H70 L34 164 L50 128 H36 A36 36 0 0 1 0 92 V36 A36 36 0 0 1 36 0 Z" fill="#3B49DF"/>
    <text x="108" y="92" font-family="Georgia, serif" font-size="88" font-weight="700" fill="#fff" text-anchor="middle">?</text>
  </g>

  <!-- answer bubble -->
  <g transform="translate(300 250)">
    <path d="M0 0 h160 a32 32 0 0 1 32 32 v52 a32 32 0 0 1 -32 32 h-96 l-16 32 -2 -32 H32 A32 32 0 0 1 0 84 V32 A32 32 0 0 1 32 0 Z" fill="#fff" stroke="#22B573" stroke-width="5"/>
    <rect x="28" y="30" width="130" height="10" rx="5" fill="#22B573"/>
    <rect x="28" y="54" width="96" height="10" rx="5" fill="#BEE6CD"/>
    <rect x="28" y="78" width="64" height="10" rx="5" fill="#BEE6CD"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(196 296)">
    <circle cx="0" cy="-16" r="34" fill="#F6C76B"/>
    <path d="M-16 6 h32 l-6 26 h-20 z" fill="#E08E0B"/>
    <rect x="-12" y="38" width="24" height="8" rx="4" fill="#B98409"/>
    <path d="M-6 -24 a14 14 0 0 1 12 -12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M480 130 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#B9C3F5"/>
  <path d="M140 240 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#B9C3F5"/>
  <path d="M500 250 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F6C76B"/>
</svg>
