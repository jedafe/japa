[package]
name = "studio-desktop"
version = "0.0.5"
description = "Japa Content Studio Desktop"
authors = ["JapaConnect"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Patch wry 0.55.1 to mark the custom URI scheme as CORS-enabled on webkit2gtk
# 2.46+. Without this, the WebView (tauri://) cannot fetch from local HTTP
# APIs such as http://localhost:8080 and shows "Load failed".
[patch.crates-io]
wry = { path = "patches/wry" }
