<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#3b49df" />
		<title>You're offline</title>
		<style>
			:root {
				--bg: #fafafa;
				--surface: #ffffff;
				--text: #0a0a0a;
				--muted: #6b7280;
				--border: #e5e7eb;
				--primary: #3b49df;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0a0a0a;
					--surface: #141414;
					--text: #f5f5f5;
					--muted: #9ca3af;
					--border: #262626;
				}
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 2.5rem 2rem;
				max-width: 24rem;
				text-align: center;
			}
			.icon {
				width: 3rem;
				height: 3rem;
				margin: 0 auto 1rem;
				color: var(--muted);
			}
			h1 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
			p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
			button {
				background: var(--primary);
				color: #fff;
				border: none;
				border-radius: 8px;
				padding: 0.6rem 1.5rem;
				font-size: 0.95rem;
				font-weight: 500;
				cursor: pointer;
			}
			button:hover { opacity: 0.9; }
		</style>
	</head>
	<body>
		<div class="card">
			<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M8.5 16.5a5 5 0 0 1 7 0" />
				<path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
				<path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
				<path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
				<path d="M5 13a10 10 0 0 1 5.24-2.76" />
				<line x1="2" y1="2" x2="22" y2="22" />
				<circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
			</svg>
			<h1>You're offline</h1>
			<p>Check your connection and try again. Pages you've visited recently may still be available while you're offline.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</div>
	</body>
</html>
