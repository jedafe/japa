# Stalwart admin gate — a stoppable public route to the Stalwart WebUI/JMAP.
#
# Traefik TLS-passthrough: HostSNI(`mail.japa.to`) on the :443 entrypoint is
# routed as raw TCP to this container, which forwards to stalwart:443. TLS
# terminates at Stalwart with its own Let's Encrypt certificate, so the
# canonical OAuth issuer (https://mail.japa.to) matches exactly — no Traefik
# cert, no HTTP-01 requirement, no port suffix.
#
# Public reachability is gated by the host's CFLOCK4 origin lockdown
# (DOCKER-USER allows only Cloudflare IPs to :80/:443, built by
# cf-lockdown.service / /usr/local/sbin/cf-origin-lockdown.sh). Admin access is
# granted persistently via the script's EXTRA_ALLOW_V4 exception list — scoped
# to the operator's source IP on :443. Ad-hoc equivalent:
#   iptables -I CFLOCK4 16 -p tcp --dport 443 -s <your-ip>/32 -j RETURN  # open
#   iptables -D CFLOCK4 -p tcp --dport 443 -s <your-ip>/32 -j RETURN     # close
# (requires the Hostinger cloud-firewall TCP 443 rule as well; mail flow and
# the Stalwart container are never touched either way)

services:
  admin-gate:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    expose:
      - "443"
    command:
      - TCP-LISTEN:443,fork,reuseaddr
      - TCP:stalwart:443
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mail-admin-gate.rule=HostSNI(`mail.japa.to`)
      - traefik.tcp.routers.mail-admin-gate.entrypoints=https
      - traefik.tcp.routers.mail-admin-gate.tls.passthrough=true
      - traefik.tcp.services.mail-admin-gate.loadbalancer.server.port=443
    networks:
      - coolify

networks:
  coolify:
    external: true
