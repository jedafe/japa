# Stalwart admin gate — a stoppable public route to the Stalwart WebUI/JMAP.
#
# Deployed as its own Coolify docker-compose service so it can be started and
# stopped independently of the MTA: mail.japa.to -> Traefik :443 -> this
# container -> https://stalwart:443 (same shared `coolify` network). Stopping
# the service drops the Traefik route, so the admin surface is only reachable
# while the gate runs. The Stalwart container itself never restarts and mail
# flow (:25, :587, :993) is unaffected.
#
# The route is defined by Traefik labels on the container (Docker provider);
# Coolify's proxy issues the mail.japa.to LE cert via HTTP-01 on first request.

services:
  admin-gate:
    image: caddy:2.9-alpine
    restart: unless-stopped
    expose:
      - "80"
    # reverse-proxy preserves the inbound Host header; --insecure skips
    # upstream cert verification (upstream cert is issued for mail.japa.to,
    # not the `stalwart` docker alias — the hop never leaves the host).
    command: >-
      caddy reverse-proxy --from :80 --to https://stalwart:443 --insecure
      --access-log
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail-admin-gate.rule=Host(`mail.japa.to`)
      - traefik.http.routers.mail-admin-gate.entrypoints=https
      - traefik.http.routers.mail-admin-gate.tls=true
      - traefik.http.routers.mail-admin-gate.tls.certresolver=letsencrypt
      - traefik.http.services.mail-admin-gate.loadbalancer.server.port=80
    networks:
      - coolify

networks:
  coolify:
    external: true
